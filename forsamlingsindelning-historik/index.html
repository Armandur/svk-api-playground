<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pastorat & församlingar över tid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Spectral:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <div>
    <h1>Pastorat & församlingar över tid</h1>
    <div class="subtitle" id="subtitle">Laddar…</div>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div id="banner" class="banner" hidden></div>

<div class="layout">
  <div id="map"></div>
  <button class="info-fab" id="info-fab" title="Visa förändringar"
    aria-label="Visa förändringar">
    <span class="info-icon">i</span><span class="close-icon">&times;</span>
  </button>
  <div class="aside-backdrop" id="aside-backdrop"></div>
  <aside id="aside-panel">
    <div id="changes-pastorat">
      <div class="empty">Välj år.</div>
    </div>
    <div id="changes-forsamlingar"></div>
  </aside>
</div>

<footer class="controls">
  <button class="play-btn" id="play-toggle" title="Spela upp tidslinje" aria-label="Spela upp"><span class="play-icon">▶</span><span class="pause-icon">■</span></button>
  <div class="year-display" id="year-display">—</div>
  <div class="slider-wrap">
    <div class="slider-ticks" aria-hidden="true"></div>
    <input type="range" id="year-slider" list="year-ticks" min="2008" max="2026" step="1" value="2026">
    <datalist id="year-ticks"></datalist>
  </div>
  <div class="layer-toggle">
    <label><input type="checkbox" id="show-pastorat" checked> Pastorat</label>
    <label><input type="checkbox" id="show-forsamlingar" checked> Församlingar</label>
    <label><input type="checkbox" id="only-changes"> Bara ändrade</label>
  </div>
</footer>

<div class="legend">
  <span class="lg-row"><span class="lg-swatch" style="background:#00554B"></span>Ny / tillagd</span>
  <span class="lg-row"><span class="lg-swatch" style="background:#BC8E4C"></span>Ändrad</span>
  <span class="lg-row"><span class="lg-swatch" style="background:#7D0037"></span>Upplöst / borttagen</span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
