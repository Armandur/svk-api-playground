<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Öppettider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Spectral:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
/* Svenska kyrkans grafiska profil. Se docs/modules/_brand.md.
   Beige + svart är grundfärger. Vinröd är dominant primärfärg.
   Mörkgrön (sekundär) används som öppet-state mot vinröd stängt-state. */
:root {
  --beige:      #FFEBE1;
  --black:      #000000;
  --wine:       #7D0037;  /* primär - dominant accent */
  --orange:     #FF785A;  /* primär */
  --pink:       #FFC3AA;  /* primär */
  --gold:       #BC8E4C;  /* sekundär */
  --dark-green: #00554B;  /* sekundär - används för öppet */
  --light-green:#BEE1C8;  /* sekundär */
  --muted:      #6b5f5a;  /* dämpad text på beige - inte i officiell palett */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font: 18px/1.4 "DM Sans", Arial, sans-serif;
  background: var(--beige); color: var(--black);
  display: flex; flex-direction: column;
  padding: clamp(16px, 3vw, 48px);
  overflow: hidden;
}

header {
  display: flex; justify-content: space-between; align-items: baseline;
  padding-bottom: clamp(12px, 2vw, 24px);
  border-bottom: 2px solid var(--wine);
  margin-bottom: clamp(20px, 3vw, 36px);
}
h1 {
  font-size: clamp(24px, 3.8vw, 44px);
  font-weight: 500; letter-spacing: -0.02em; line-height: 1.0;
  color: var(--wine);
}
h1 .subtitle {
  display: block; font-family: "Spectral", "Times New Roman", serif;
  font-style: italic; font-weight: 400; font-size: 0.5em;
  color: var(--black); margin-top: 8px; letter-spacing: 0;
}
.clock {
  font: 500 clamp(20px, 2.8vw, 34px)/1 "DM Sans", monospace;
  font-variant-numeric: tabular-nums;
  color: var(--wine);
}

.status {
  display: flex; align-items: center; gap: clamp(24px, 4vw, 64px);
  padding: clamp(24px, 4vw, 56px) clamp(28px, 5vw, 72px);
  border: 3px solid var(--wine);
  margin-bottom: clamp(20px, 3vw, 36px);
  background: transparent;
}
.status.open { border-color: var(--dark-green); }
.status .badge {
  font-size: clamp(56px, 11vw, 160px); font-weight: 700;
  letter-spacing: -0.04em; line-height: 0.95;
  color: var(--wine);
}
.status.open .badge { color: var(--dark-green); }
.status .detail {
  font-size: clamp(20px, 2.6vw, 36px);
  font-weight: 500; line-height: 1.15;
}
.status .detail .when {
  display: block; margin-top: 6px;
  font-family: "Spectral", "Times New Roman", serif;
  font-style: italic; font-weight: 400; font-size: 0.65em;
  color: var(--muted);
}

table.schedule {
  width: 100%; border-collapse: collapse;
  font-size: clamp(16px, 1.7vw, 24px);
}
table.schedule th, table.schedule td {
  text-align: left; padding: clamp(10px, 1.2vw, 16px) clamp(12px, 1.5vw, 20px);
  border-bottom: 1px solid rgba(125, 0, 55, 0.2);
}
table.schedule th {
  color: var(--muted); font-weight: 500; font-size: 0.7em;
  text-transform: uppercase; letter-spacing: 0.08em;
  border-bottom-color: var(--wine); border-bottom-width: 2px;
}
table.schedule td:first-child { font-weight: 500; }
table.schedule tr.today td {
  color: var(--wine); font-weight: 700;
  background: rgba(125, 0, 55, 0.06);
}
.closed-cell { color: var(--muted); font-style: italic;
               font-family: "Spectral", "Times New Roman", serif; }

.hours-info {
  margin-top: clamp(16px, 2vw, 24px);
  padding: clamp(12px, 1.8vw, 18px) clamp(16px, 2vw, 22px);
  border-left: 3px solid var(--wine);
  background: rgba(125, 0, 55, 0.05);
  font-family: "Spectral", "Times New Roman", serif; font-style: italic;
  font-size: clamp(14px, 1.6vw, 19px); line-height: 1.45;
  white-space: pre-line;  /* respektera \n från CMS-fältet */
}

.validity-banner {
  margin-bottom: clamp(14px, 2vw, 22px);
  padding: clamp(10px, 1.4vw, 16px) clamp(14px, 2vw, 22px);
  background: var(--wine); color: var(--beige);
  font-size: clamp(15px, 1.9vw, 24px);
  font-weight: 500; letter-spacing: 0.01em; line-height: 1.3;
}
.validity-banner em {
  font-family: "Spectral", "Times New Roman", serif;
  font-style: italic; font-weight: 400; opacity: 0.9;
  margin-right: 6px;
}

.facilities {
  margin-top: clamp(16px, 2vw, 22px);
  display: flex; flex-wrap: wrap; gap: clamp(10px, 1.5vw, 16px);
  font-size: clamp(12px, 1.3vw, 15px);
}
.facility {
  padding: 4px 12px; border: 1px solid var(--wine); color: var(--wine);
  font-weight: 500; letter-spacing: 0.02em;
}

.visiting {
  margin-top: clamp(12px, 1.5vw, 18px);
  font-size: clamp(13px, 1.4vw, 16px); color: var(--muted);
  font-family: "Spectral", "Times New Roman", serif; font-style: italic;
  display: flex; flex-wrap: wrap; gap: clamp(10px, 2vw, 24px);
}
.visiting .label { color: var(--wine); font-style: normal; font-weight: 500;
                   font-family: "DM Sans", sans-serif; margin-right: 6px;
                   text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.85em; }

footer {
  margin-top: auto; padding-top: clamp(12px, 2vw, 20px);
  border-top: 1px solid rgba(0,0,0,0.15);
  display: flex; justify-content: space-between;
  font-size: 0.8em; color: var(--muted);
}
.error {
  background: var(--wine); color: var(--beige);
  padding: 14px 20px; font-weight: 500;
  font-size: clamp(16px, 2vw, 22px);
}
</style>
</head>
<body>
<header>
  <h1>
    <span id="placeName">Laddar…</span>
    <span class="subtitle" id="ownerName"></span>
  </h1>
  <div class="clock" id="clock">--:--:--</div>
</header>

<div id="statusCard" class="status">
  <div class="badge" id="statusBadge">…</div>
  <div class="detail" id="statusDetail"></div>
</div>

<div id="validityBanner" class="validity-banner" hidden></div>

<table class="schedule" id="schedule">
  <thead><tr><th>Dag</th><th>Öppet</th></tr></thead>
  <tbody></tbody>
</table>

<div id="openHoursInfo" class="hours-info" hidden></div>

<div id="facilities" class="facilities" hidden></div>

<div id="visiting" class="visiting" hidden></div>

<footer>
  <span id="periodInfo"></span>
  <span>Uppdaterad: <span id="updatedAt">-</span></span>
</footer>

<script>
const REFRESH_DATA_MS = 60_000;
const CLOCK_TICK_MS = 1_000;
const DAY_KEYS = ['su', 'mo', 'tu', 'we', 'th', 'fr', 'sa']; // index = Date.getDay()
const DAY_ORDER = ['mo', 'tu', 'we', 'th', 'fr', 'sa', 'su'];
const DAY_LABEL = { mo:'Måndag', tu:'Tisdag', we:'Onsdag', th:'Torsdag',
                    fr:'Fredag', sa:'Lördag', su:'Söndag' };

let cachedData = null;

function pad(n) { return String(n).padStart(2, '0'); }
function nowMinutes(d) { return d.getHours() * 60 + d.getMinutes(); }
function parseHHMM(s) { const [h, m] = s.split(':').map(Number); return h * 60 + m; }
function fmtHHMM(s) { return s; } // redan "HH:MM"

// Returnerar period som är aktiv för datumet d (eller första som matchar)
function activePeriod(periods, d) {
  if (!periods || !periods.length) return null;
  const ymd = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  for (const p of periods) {
    const okFrom = !p.validFrom || p.validFrom <= ymd;
    const okTo = !p.validTo || p.validTo >= ymd;
    if (okFrom && okTo) return p;
  }
  return periods[0]; // fallback
}

// { open: bool, openUntil?: "HH:MM", nextOpen?: {dayLabel, time} }
function computeStatus(period, d) {
  if (!period) return { open: false, nextOpen: null };
  const days = period.days || {};
  const todayKey = DAY_KEYS[d.getDay()];
  const intervals = days[todayKey] || [];
  const now = nowMinutes(d);
  for (const iv of intervals) {
    const f = parseHHMM(iv.from), t = parseHHMM(iv.to);
    if (now >= f && now < t) return { open: true, openUntil: iv.to };
  }
  // Hitta nästa öppning: först idag (intervall efter nu), sen framåt 7 dagar
  for (const iv of intervals) {
    if (parseHHMM(iv.from) > now) {
      return { open: false, nextOpen: { dayLabel: 'i dag', time: iv.from } };
    }
  }
  for (let i = 1; i <= 7; i++) {
    const dn = new Date(d); dn.setDate(d.getDate() + i);
    const k = DAY_KEYS[dn.getDay()];
    const ivs = days[k] || [];
    if (ivs.length) {
      const dayLabel = i === 1 ? 'i morgon' : DAY_LABEL[k];
      return { open: false, nextOpen: { dayLabel, time: ivs[0].from } };
    }
  }
  return { open: false, nextOpen: null };
}

function renderSchedule(period, d) {
  const tbody = document.querySelector('#schedule tbody');
  tbody.innerHTML = '';
  if (!period) {
    tbody.innerHTML = '<tr><td colspan="2" class="closed-cell">Inga öppettider angivna.</td></tr>';
    return;
  }
  const todayKey = DAY_KEYS[d.getDay()];
  for (const k of DAY_ORDER) {
    const tr = document.createElement('tr');
    if (k === todayKey) tr.classList.add('today');
    const ivs = (period.days || {})[k] || [];
    const cells = ivs.length
      ? ivs.map(iv => `${fmtHHMM(iv.from)}–${fmtHHMM(iv.to)}`).join(', ')
      : '<span class="closed-cell">stängt</span>';
    tr.innerHTML = `<td>${DAY_LABEL[k]}</td><td>${cells}</td>`;
    tbody.appendChild(tr);
  }
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function renderHoursInfo(place) {
  const el = document.getElementById('openHoursInfo');
  const info = place.openHours?.info?.trim();
  if (info) {
    el.textContent = info;
    el.hidden = false;
  } else {
    el.hidden = true;
  }
}

const SV_MONTHS = ['januari','februari','mars','april','maj','juni',
                   'juli','augusti','september','oktober','november','december'];

function fmtSwedishDate(ymd) {
  if (!ymd) return '';
  const d = new Date(ymd + 'T12:00:00Z');
  return `${d.getUTCDate()} ${SV_MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}

function renderValidityBanner(period) {
  const el = document.getElementById('validityBanner');
  // Visa bara när perioden har en slutgräns (säsongs- eller avvikelseperiod).
  // Permanent period (validTo saknas) = ordinarie öppettider, ingen banner.
  if (!period || !period.validTo) {
    el.hidden = true;
    return;
  }
  const from = period.validFrom ? fmtSwedishDate(period.validFrom) : null;
  const to = fmtSwedishDate(period.validTo);
  let html;
  if (period.validFrom === period.validTo) {
    html = `<em>Öppettider gäller</em> ${to}`;
  } else if (from) {
    html = `<em>Öppettider gäller</em> ${from} - ${to}`;
  } else {
    html = `<em>Öppettider gäller fram till</em> ${to}`;
  }
  el.innerHTML = html;
  el.hidden = false;
}

const FACILITY_LABELS = {
  hasToilet: 'Toalett',
  hasWifi: 'Wi-Fi',
  hasCafe: 'Café',
  hasChargingStation: 'Laddstation',
  hasParking: 'Parkering',
};
const ACCESS_LABELS = {
  toiletAccessible: 'Tillgänglig toalett',
  hasHearingLoop: 'Hörselslinga',
  hasRamp: 'Ramp',
};

function renderFacilities(place) {
  const el = document.getElementById('facilities');
  const pd = place.placeDetails || {};
  const acc = pd.accessibility || {};
  const tags = [];
  for (const [k, label] of Object.entries(FACILITY_LABELS)) if (pd[k]) tags.push(label);
  for (const [k, label] of Object.entries(ACCESS_LABELS)) if (acc[k]) tags.push(label);
  if (!tags.length) { el.hidden = true; return; }
  el.innerHTML = tags.map(t => `<span class="facility">${escapeHtml(t)}</span>`).join('');
  el.hidden = false;
}

function fmtPhone(p) {
  if (!p) return null;
  const { countryCode, areaCode, number } = p;
  if (!number) return null;
  const parts = [];
  if (countryCode) parts.push(`+${countryCode}`);
  if (areaCode) parts.push(String(areaCode));
  parts.push(String(number));
  return parts.join(' ');
}

function renderVisiting(place) {
  const el = document.getElementById('visiting');
  const v = place.visitingInfo || {};
  const c = place.contactInfo || {};
  const items = [];
  const addr = [v.address, [v.postalCode, v.city].filter(Boolean).join(' ')]
    .filter(Boolean).join(', ');
  if (addr) items.push(`<span><span class="label">Adress</span>${escapeHtml(addr)}</span>`);
  const phone = fmtPhone(c.phone);
  if (phone) items.push(`<span><span class="label">Tel</span>${escapeHtml(phone)}</span>`);
  if (c.email) items.push(`<span><span class="label">E-post</span>${escapeHtml(c.email)}</span>`);
  if (!items.length) { el.hidden = true; return; }
  el.innerHTML = items.join('');
  el.hidden = false;
}

function renderPeriodInfo(period) {
  const el = document.getElementById('periodInfo');
  if (!period) { el.textContent = ''; return; }
  const parts = [];
  if (period.validFrom) parts.push(`från ${period.validFrom}`);
  if (period.validTo) parts.push(`till ${period.validTo}`);
  el.textContent = parts.length ? `Period: ${parts.join(' ')}` : 'Standardperiod';
}

function render(now) {
  if (!cachedData) return;
  const place = cachedData.place;
  document.getElementById('placeName').textContent = place.name || '(namn saknas)';
  document.getElementById('ownerName').textContent = place.owner?.name || '';
  document.getElementById('updatedAt').textContent = cachedData.fetched_at
    ? new Date(cachedData.fetched_at).toLocaleString('sv-SE')
    : '-';

  const period = activePeriod(place.openHours?.periods, now);
  renderPeriodInfo(period);
  renderValidityBanner(period);
  renderSchedule(period, now);
  renderHoursInfo(place);
  renderFacilities(place);
  renderVisiting(place);

  const status = computeStatus(period, now);
  const card = document.getElementById('statusCard');
  const badge = document.getElementById('statusBadge');
  const detail = document.getElementById('statusDetail');
  card.classList.toggle('open', status.open);
  card.classList.toggle('closed', !status.open);

  if (status.open) {
    badge.textContent = 'ÖPPET';
    detail.innerHTML = `Stänger kl. ${status.openUntil}
      <span class="when">just nu öppet</span>`;
  } else {
    badge.textContent = 'STÄNGT';
    if (status.nextOpen) {
      detail.innerHTML = `Öppnar ${status.nextOpen.dayLabel} kl. ${status.nextOpen.time}
        <span class="when">stängt just nu</span>`;
    } else {
      detail.innerHTML = `<span class="when">Inga kommande öppettider.</span>`;
    }
  }
}

function renderClock(now) {
  document.getElementById('clock').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}

async function fetchData() {
  try {
    const r = await fetch('place.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    cachedData = await r.json();
    render(new Date());
  } catch (e) {
    document.getElementById('statusBadge').textContent = '!';
    document.getElementById('statusDetail').innerHTML =
      `<div class="error">Kunde inte ladda öppettider: ${e.message}</div>`;
  }
}

function tick() {
  const now = new Date();
  renderClock(now);
  // Räkna om status varje minut (när sekunderna är 0)
  if (cachedData && now.getSeconds() === 0) render(now);
}

fetchData();
setInterval(fetchData, REFRESH_DATA_MS);
setInterval(tick, CLOCK_TICK_MS);
tick();
</script>
</body>
</html>
