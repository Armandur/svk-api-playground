<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Löneservice - visualisering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Spectral:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --beige:      #FFEBE1;
  --black:      #000000;
  --wine:       #7D0037;
  --pink:       #FFC3AA;
  --gold:       #BC8E4C;
  --dark-green: #00554B;
  --muted:      #6b5f5a;
  --line:       rgba(125, 0, 55, 0.2);
  --ja:         #00554B;
  --nej:        #7D0037;
  --saknas:     #b9a89e;
  --kart-grans: #6b5f5a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body { min-height: 100%; }
body {
  font: 15px/1.45 "DM Sans", Arial, sans-serif;
  background: var(--beige); color: var(--black);
  display: flex; flex-direction: column;
  min-height: 100vh;       /* fallback för äldre browsers */
  min-height: 100dvh;      /* följer mobilens adressfält dynamiskt */
}
header {
  padding: 12px 20px; border-bottom: 1px solid var(--line);
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
}
h1 {
  font-size: 22px; font-weight: 500; color: var(--wine);
  letter-spacing: -0.01em;
}
header .subtitle {
  font-family: "Spectral", "Times New Roman", serif; font-style: italic;
  color: var(--muted); font-size: 13px;
}
header .stats { font-size: 13px; color: var(--muted); }
header .stats b { color: var(--wine); font-weight: 600; }

#map { flex: 1; min-height: 60vh; background: var(--beige); }
.leaflet-container { font: 14px "DM Sans", Arial, sans-serif; }

.popup-name {
  font-weight: 500; color: var(--wine); font-size: 16px;
  margin-bottom: 2px;
}
.popup-stift {
  font-family: "Spectral", "Times New Roman", serif; font-style: italic;
  color: var(--muted); font-size: 13px; margin-bottom: 8px;
}
.popup-status { font-weight: 500; padding: 2px 8px; border-radius: 2px;
                display: inline-block; font-size: 13px; }
.popup-status.ja  { background: var(--ja); color: #fff; }
.popup-status.nej { background: var(--nej); color: #fff; }
.popup-status.saknas { background: var(--saknas); color: #fff; }
.popup-context {
  margin-top: 8px; padding-top: 6px;
  border-top: 1px solid var(--line);
}
.popup-context-row {
  font-size: 11px; color: var(--muted); margin-bottom: 3px;
}
.popup-context-meta {
  margin-top: 3px; font-family: "Spectral", serif; font-style: italic;
}
.popup-context .konto-bar {
  position: relative; height: 6px; width: 100%;
  background: rgba(125, 0, 55, 0.18); border-radius: 1px;
  overflow: hidden;
}
.popup-context .konto-bar > span {
  position: absolute; top: 0; left: 0; height: 100%;
  background: var(--ja);
}
.popup-meta {
  margin-top: 8px; font-size: 13px; color: var(--muted);
  border-top: 1px solid var(--line); padding-top: 6px;
}

.panel {
  background: var(--beige); padding: 10px 12px;
  border: 1px solid var(--wine);
  font: 13px "DM Sans", Arial, sans-serif;
  box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  max-width: 320px;
}
.panel .lp-title {
  font-size: 11px; color: var(--wine); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 8px;
}
.legend .lg-row {
  display: flex; align-items: center; gap: 8px;
  padding: 2px 0; line-height: 1.3;
}
.legend .lg-swatch {
  display: inline-block; width: 18px; height: 14px; border-radius: 2px;
  border: 1px solid rgba(0,0,0,0.25); flex-shrink: 0;
}
.legend .lg-line {
  display: inline-block; width: 18px; height: 0;
  border-top: 2px dashed var(--kart-grans); flex-shrink: 0;
}
.legend .lg-pill {
  display: inline-block; padding: 1px 6px; border-radius: 2px;
  color: #fff; font-size: 10px; font-weight: 600;
  border: 1px solid #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.25);
  flex-shrink: 0;
}
.summary { max-width: none; }
.summary table { border-collapse: collapse; font-size: 12px;
                 white-space: nowrap; }
.summary th, .summary td { padding: 2px 6px; text-align: right; }
.summary th:first-child, .summary td:first-child { text-align: left; }
.summary thead th { color: var(--wine); font-weight: 600;
                    border-bottom: 1px solid var(--line); }
.summary tr.total td { border-top: 1px solid var(--line);
                       font-weight: 600; color: var(--wine); }
.summary tr.separator td { border-top: 1px solid var(--line);
                           padding: 0; height: 4px; }
.summary tr.tross-row td { font-style: italic; }
.summary .pct { color: var(--muted); }
.summary td.bar-cell { width: 80px; padding: 4px 6px; }
.summary .konto-bar {
  position: relative; height: 8px; width: 100%;
  background: rgba(125, 0, 55, 0.18); border-radius: 1px;
  overflow: hidden;
}
.summary .konto-bar > span {
  position: absolute; top: 0; left: 0; height: 100%;
  background: var(--ja);
}
.summary tr.total .konto-bar { background: rgba(125, 0, 55, 0.25); }

.tabs { display: flex; gap: 0; margin-bottom: 6px;
        border-bottom: 1px solid var(--line); }
.tabs button {
  background: none; border: none; cursor: pointer;
  padding: 4px 8px; font: 500 11px "DM Sans", Arial, sans-serif;
  color: var(--muted); letter-spacing: 0.02em; text-transform: uppercase;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tabs button:hover { color: var(--wine); }
.tabs button.active {
  color: var(--wine); border-bottom-color: var(--wine);
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.donut-row {
  display: flex; gap: 16px; justify-content: center;
  margin: 10px 0 12px; align-items: center;
}
.donut-card { text-align: center; }
.donut-card svg { display: block; margin: 0 auto 4px; }
.donut-card .donut-label {
  font-size: 11px; color: var(--muted); letter-spacing: 0.02em;
  text-transform: uppercase;
}
.donut-card .donut-pct {
  font-size: 20px; font-weight: 600; color: var(--ja);
  letter-spacing: -0.01em;
}
.donut-card .donut-meta {
  font-size: 11px; color: var(--muted); margin-top: 2px;
}

.histo-wrap { padding: 6px 4px 4px; }
.histo-wrap .histo-meta {
  font-size: 11px; color: var(--muted); margin-bottom: 6px;
  font-family: "Spectral", serif; font-style: italic;
}
.histo-svg { display: block; width: 100%; height: 130px; }
.histo-bar-ja { fill: var(--ja); }
.histo-bar-nej { fill: var(--nej); }
.histo-axis-label {
  font-size: 10px; fill: var(--muted);
  font-family: "DM Sans", Arial, sans-serif;
}

/* Mobil-UI: en knapprad nere till vänster och en fällbar bottom-sheet
   som visar respektive panel. På desktop är dessa dolda och Leaflet-
   panelernas vanliga positioner gäller. */
.mobile-bar { display: none; }
.mobile-sheet { display: none; }

@media (max-width: 700px) {
  /* Headern krymper - subtitle gömd, totalrad räcker. */
  header { padding: 8px 14px; }
  h1 { font-size: 18px; }
  header .subtitle { font-size: 12px; }
  #map { min-height: 0; }

  /* Dölj Leaflet-kontroller utom zoom (bottomright). */
  .leaflet-top.leaflet-left,
  .leaflet-top.leaflet-right,
  .leaflet-bottom.leaflet-left { display: none; }

  /* Knapprad: tre FAB-knappar nere till vänster. Bottom-värdet sätts
     dynamiskt via alignMobileBar() så att underkanten linjerar med
     zoom-out-knappens underkant oberoende av attribution-höjd. */
  .mobile-bar {
    display: flex; gap: 8px;
    position: fixed; left: 12px; bottom: 28px;
    z-index: 1000;
  }
  .mobile-bar button {
    background: var(--beige); color: var(--wine);
    border: 1px solid var(--wine); border-radius: 4px;
    padding: 10px 14px; min-height: 44px;
    font: 500 14px "DM Sans", Arial, sans-serif;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    cursor: pointer;
  }
  .mobile-bar button.active {
    background: var(--wine); color: var(--beige);
  }

  /* Bottom-sheet: glider upp underifrån när öppen. */
  .mobile-sheet {
    display: block;
    position: fixed; left: 0; right: 0; bottom: 0;
    max-height: 75vh;
    max-height: 75dvh;
    overflow-y: auto;
    background: var(--beige);
    border-top: 2px solid var(--wine);
    box-shadow: 0 -2px 12px rgba(0,0,0,0.25);
    transform: translateY(100%);
    transition: transform 0.2s ease-out;
    z-index: 1100;
  }
  .mobile-sheet.open { transform: translateY(0); }
  .mobile-sheet-handle {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; border-bottom: 1px solid var(--line);
    background: rgba(125, 0, 55, 0.06);
  }
  .mobile-sheet-handle .title {
    font-weight: 500; color: var(--wine);
    text-transform: uppercase; letter-spacing: 0.04em; font-size: 12px;
  }
  .mobile-sheet-handle .close {
    background: none; border: none; cursor: pointer;
    color: var(--wine); font-size: 22px; line-height: 1;
    padding: 4px 8px; min-width: 44px; min-height: 44px;
  }
  .mobile-sheet-content {
    padding: 12px 14px;
  }
  .mobile-sheet-content .panel {
    border: none; box-shadow: none; padding: 0;
    background: transparent; max-width: none;
  }

  /* Statspanel: tighta tabellen. Flikraden får horisontell scroll
     vid trångt utrymme. */
  .summary table { font-size: 11px; }
  .tabs { overflow-x: auto; flex-wrap: nowrap; }
  .tabs button {
    flex-shrink: 0; min-height: 44px; padding: 10px 12px;
    font-size: 12px;
  }

  /* Touch-targets */
  .toggle-row label { padding: 8px 2px; min-height: 44px; align-items: center; }
  .toggle-row input[type="checkbox"] { width: 18px; height: 18px; }
  select { min-height: 44px; padding: 8px 10px !important; font-size: 14px !important; }

  /* Tooltips (hover) triggas av touch på mobil och dyker upp samtidigt
     som popup. Dölj dem helt - popupen räcker. */
  .leaflet-tooltip { display: none !important; }
}

.top-list ol { list-style: none; counter-reset: rank;
               padding: 0; margin: 0; font-size: 12px; }
.top-list li {
  display: grid; grid-template-columns: 18px 1fr auto;
  gap: 6px; align-items: baseline;
  padding: 3px 0; border-bottom: 1px dotted var(--line);
}
.top-list li:last-child { border-bottom: none; }
.top-list li.klickbar { cursor: pointer; }
.top-list li.klickbar:hover { background: rgba(125, 0, 55, 0.04); }
.top-list li::before {
  counter-increment: rank; content: counter(rank);
  color: var(--muted); font-variant-numeric: tabular-nums;
  text-align: right;
}
.top-list .top-namn { font-weight: 500; }
.top-list .top-stift {
  font-family: "Spectral", serif; font-style: italic;
  color: var(--muted); font-size: 11px; display: block;
}
.top-list .top-konton {
  font-variant-numeric: tabular-nums; color: var(--wine);
  font-weight: 500;
}

.toggle-row { display: flex; flex-direction: column; gap: 2px;
              margin-bottom: 4px; }
.toggle-row label { display: flex; align-items: center; gap: 6px;
                    cursor: pointer; user-select: none; padding: 1px 2px; }
.toggle-row input { accent-color: var(--wine); }
.filter { max-width: 200px; }
.choro-scale {
  display: none; margin-top: 6px;
  font-size: 10px; color: var(--muted);
}
.choro-scale.show { display: block; }
.choro-scale .row { display: flex; align-items: center; gap: 6px;
                    margin-top: 2px; }
.choro-scale .sw { width: 14px; height: 8px; border-radius: 1px;
                   border: 1px solid rgba(0,0,0,0.1); }

.offshore-badge-wrap, .offshore-arrow-wrap {
  position: absolute; width: 0; height: 0;
}
.offshore-badge {
  position: absolute; transform-origin: 0 0;
  padding: 4px 8px; border-radius: 3px;
  font: 500 11px "DM Sans", Arial, sans-serif;
  white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  border: 1px solid #fff; color: #fff;
  display: inline-block; line-height: 1.2;
  cursor: pointer;
}
.offshore-badge small { display: block; font-weight: 400; opacity: 0.85;
                        font-size: 10px; }
.offshore-badge.ja  { background: var(--ja); }
.offshore-badge.nej { background: var(--nej); }
.offshore-arrow-svg {
  position: absolute; pointer-events: none;
  overflow: visible;
}
</style>
</head>
<body>

<header>
  <div>
    <h1>Löneservice - anslutna enheter</h1>
    <div class="subtitle" id="subtitle">Laddar data...</div>
  </div>
</header>

<div id="map"></div>

<div class="mobile-bar">
  <button data-mobile-panel="summary">Statistik</button>
  <button data-mobile-panel="filter">Filter</button>
  <button data-mobile-panel="legend">Förklaring</button>
</div>

<div class="mobile-sheet" id="mobile-sheet">
  <div class="mobile-sheet-handle">
    <span class="title" id="mobile-sheet-title"></span>
    <button class="close" id="mobile-sheet-close" aria-label="Stäng">&times;</button>
  </div>
  <div class="mobile-sheet-content" id="mobile-sheet-content"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLORS = {
  ja: "#00554B",
  nej: "#7D0037",
  saknas: "#b9a89e",
  wine: "#7D0037",
  kartGrans: "#6b5f5a",
};

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function fmtInt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }

const map = L.map("map", {
  preferCanvas: true,
  zoomControl: false,
}).setView([62.5, 16.0], 5);
L.control.zoom({ position: "bottomright" }).addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "© OpenStreetMap-bidragsgivare",
}).addTo(map);

let dataset = null;       // { enheter, stiftsenheter, ovrigt, trossamfund, stift_summary }
let accountsLayer = null;
let choroplethLayer = null;
let minKonton = 0;        // storleksfilter: dölj enheter med < N konton
let focusStift = "";      // stift-fokus: "" = visa alla, annars stiftnamn
let activeTab = "overview"; // statspanelens aktiva flik
const stiftBounds = {};   // stiftnamn -> L.LatLngBounds (cachat från geojson)
const enhetLayers = {};   // enhetsnamn -> L.Layer (cachat för klick-zoom)
const offshoreAnchors = {}; // enhetsnamn -> [lat, lng] för off-shore-zoom
const offshoreBadges = {};  // enhetsnamn -> badge-marker för popup-öppning

// URL-hash state - delbara vyer.
// Default: alla statusfärger visas, lager enheter+stift+offshore på,
// accounts+choropleth av, ingen min-storlek, inget stift-fokus,
// fliken Översikt aktiv. Bara avvikelser från default skrivs till hash.
const layersOn = {
  enheter: true, stift: true, offshore: true,
  accounts: false, choropleth: false,
};
let suppressHashWrite = false;  // hindrar oändlig loop när vi själva sätter hash

function readHash() {
  const params = new URLSearchParams(location.hash.replace(/^#/, ""));
  return {
    tab: params.get("tab") || "overview",
    stift: params.get("stift") || "",
    min: parseInt(params.get("min"), 10) || 0,
    ja: params.get("ja") !== "0",
    nej: params.get("nej") !== "0",
    enheter: params.get("enheter") !== "0",
    stiftLager: params.get("stiftLager") !== "0",
    offshore: params.get("offshore") !== "0",
    accounts: params.get("accounts") === "1",
    choropleth: params.get("choropleth") === "1",
  };
}

function writeHash() {
  if (suppressHashWrite) return;
  const params = new URLSearchParams();
  if (activeTab !== "overview") params.set("tab", activeTab);
  if (focusStift) params.set("stift", focusStift);
  if (minKonton) params.set("min", String(minKonton));
  if (!visible.ja) params.set("ja", "0");
  if (!visible.nej) params.set("nej", "0");
  if (!layersOn.enheter) params.set("enheter", "0");
  if (!layersOn.stift) params.set("stiftLager", "0");
  if (!layersOn.offshore) params.set("offshore", "0");
  if (layersOn.accounts) params.set("accounts", "1");
  if (layersOn.choropleth) params.set("choropleth", "1");
  const s = params.toString();
  const newHash = s ? "#" + s : "";
  if (location.hash !== newHash) {
    history.replaceState(null, "",
      location.pathname + location.search + newHash);
  }
}

function applyHashState() {
  const state = readHash();
  suppressHashWrite = true;

  // Filter och status-toggles
  visible.ja = state.ja;
  visible.nej = state.nej;
  minKonton = state.min;
  focusStift = state.stift;

  // Lager-toggles
  layersOn.enheter = state.enheter;
  layersOn.stift = state.stiftLager;
  layersOn.offshore = state.offshore;
  layersOn.accounts = state.accounts;
  layersOn.choropleth = state.choropleth;

  // Synka UI-kontroller
  document.querySelectorAll('input[data-key="ja"]').forEach(i => i.checked = state.ja);
  document.querySelectorAll('input[data-key="nej"]').forEach(i => i.checked = state.nej);
  const minSel = document.getElementById("min-konton");
  if (minSel) minSel.value = String(state.min);
  const stiftSel = document.getElementById("focus-stift");
  if (stiftSel) stiftSel.value = state.stift;
  for (const [key, on] of Object.entries(layersOn)) {
    document.querySelectorAll(`input[data-layer="${key}"]`).forEach(i => i.checked = on);
  }

  // Applicera på kartan
  const layerByKey = {
    enheter: enheterLayer, stift: stiftLayer, offshore: offshoreLayer,
    accounts: accountsLayer, choropleth: choroplethLayer,
  };
  for (const [key, on] of Object.entries(layersOn)) {
    const layer = layerByKey[key];
    if (!layer) continue;
    if (on && !map.hasLayer(layer)) map.addLayer(layer);
    else if (!on && map.hasLayer(layer)) map.removeLayer(layer);
  }
  if (enheterLayer) enheterLayer.setStyle(styleEnhet);
  applyAccountsVisibility();
  applyOffshoreVisibility();
  document.getElementById("choro-scale")?.classList.toggle("show", state.choropleth);

  // Stift-fokus = zooma till bounds
  const b = focusStift && stiftBounds[focusStift];
  if (b) map.fitBounds(b, { padding: [20, 20] });

  // Aktiv flik
  activeTab = state.tab;
  document.querySelectorAll(".tabs button").forEach(btn =>
    btn.classList.toggle("active", btn.dataset.tab === activeTab));
  document.querySelectorAll(".tab-panel").forEach(p =>
    p.classList.toggle("active", p.dataset.panel === activeTab));

  suppressHashWrite = false;
}
let enheterLayer = null;  // L.geoJson över ekonomiska enheter
let stiftLayer = null;    // L.geoJson stift-gränser
let offshoreLayer = null; // L.layerGroup med stiftskanslier, ovrigt, trossamfund
const offshoreItems = []; // [{ marker, status }] för filter-toggling
const offshoreEntries = []; // [{ arrowMarker, badgeMarker, cityLatLng, dxPref, dyPref, status, width, height }]
let layoutScheduled = false;
const visible = { ja: true, nej: true, saknas: true };

// Stiftskoder enligt Unit-API:s skpkod (stiftens kanoniska ordning).
// Trossamfundet är inte ett stift men listas separat med högsta sort-key.
const STIFT_KOD = {
  "Uppsala stift": "01",
  "Linköpings stift": "02",
  "Skara stift": "03",
  "Strängnäs stift": "04",
  "Västerås stift": "05",
  "Växjö stift": "06",
  "Lunds stift": "07",
  "Göteborgs stift": "08",
  "Karlstads stift": "09",
  "Härnösands stift": "10",
  "Luleå stift": "11",
  "Visby stift": "12",
  "Stockholms stift": "13",
};
const TROSS_NAMN = "Trossamfundet Svenska kyrkan";

// Kort visningsnamn per stift = stadsnamn utan eventuellt genitiv-s.
const STIFT_STAD = {
  "Uppsala stift": "Uppsala",
  "Linköpings stift": "Linköping",
  "Skara stift": "Skara",
  "Strängnäs stift": "Strängnäs",
  "Västerås stift": "Västerås",
  "Växjö stift": "Växjö",
  "Lunds stift": "Lund",
  "Göteborgs stift": "Göteborg",
  "Karlstads stift": "Karlstad",
  "Härnösands stift": "Härnösand",
  "Luleå stift": "Luleå",
  "Visby stift": "Visby",
  "Stockholms stift": "Stockholm",
};

// [stad, stiftslat, stiftslon] - centrum av huvudort.
const STAD = {
  Uppsala:    [59.86, 17.64],
  Linköping:  [58.41, 15.62],
  Skara:      [58.39, 13.44],
  Strängnäs:  [59.38, 17.03],
  Västerås:   [59.61, 16.55],
  Växjö:      [56.88, 14.81],
  Lund:       [55.70, 13.19],
  Göteborg:   [57.71, 11.97],
  Karlstad:   [59.40, 13.51],
  Härnösand:  [62.63, 17.94],
  Luleå:      [65.58, 22.16],
  Visby:      [57.64, 18.30],
  Stockholm:  [59.33, 18.07],
  Karlskrona: [56.16, 15.59],
};

// Off-shore-offsets i PIXEL relativt stadens latlng. dx>0 = öster,
// dy>0 = söder. Genom att använda pixel-space istället för lat/lon
// stannar varje badge alltid lika långt från sin stad oavsett zoom,
// kollar inte med varandra och hamnar i en bestämd kompass-riktning
// (vald mot havet/insjön där det går).
// Format: [namn-i-CSV, anchor-stad, [dx, dy]]
const OFFSHORE_STIFT = {
  "Göteborgs stift":    ["Göteborg",   [-150, -30]],   // Skagerack V
  "Lunds stift":        ["Lund",       [-100,  70]],   // Öresund SV
  "Växjö stift":        ["Växjö",      [ 130,  80]],   // Östersjön SÖ
  "Visby stift":        ["Visby",      [-110,   0]],   // Östersjön V (om Gotland)
  "Linköpings stift":   ["Linköping",  [ 150,   0]],   // Östersjön Ö
  "Skara stift":        ["Skara",      [-100, -30]],   // Vänern NV
  "Karlstads stift":    ["Karlstad",   [ -50,  90]],   // Vänern S
  "Strängnäs stift":    ["Strängnäs",  [  90, -60]],   // Mälaren NÖ
  "Västerås stift":     ["Västerås",   [  90,  70]],   // Mälaren SÖ
  "Stockholms stift":   ["Stockholm",  [ 170, -90]],   // Östersjön Ö (kolumn)
  "Uppsala stift":      ["Uppsala",    [ 180, -50]],   // Bottenhavet Ö
  "Härnösands stift":   ["Härnösand",  [ 150,   0]],   // Bottenhavet Ö
  "Luleå stift":        ["Luleå",      [ 160,  20]],   // Bottenviken Ö
};

// Övriga enheter (utan eget område i geojson) - mappa till orten de hör till.
const OFFSHORE_OVRIGT = {
  "Hovförsamlingen":                    ["Stockholm",  [ 170, -30]],
  "Finska församlingen":                ["Stockholm",  [ 170,  30]],
  "Tyska S:ta Gertruds församling":     ["Stockholm",  [ 170,  90]],
  "Karlskrona Amiralitetsförsamling":   ["Karlskrona", [ 100,  50]],
  "Göteborgs begravningssamfällighet":  ["Göteborg",   [-150,  30]],
};

// Trossamfundet (Nationell nivå) ankrar mot Uppsala, separerat från
// Uppsala stift via olika dy.
const OFFSHORE_TROSS = ["Uppsala", [180, 30]];

function statusForFeature(props) {
  const namn = (props.namn || "").trim();
  const e = dataset?.enheter?.[namn];
  if (!e) return { key: "saknas", konton: 0, stift: null };
  return { key: e.ja ? "ja" : "nej", konton: e.konton, stift: e.stift };
}

function styleEnhet(feature) {
  const st = statusForFeature(feature.properties);
  const wrongStift = focusStift && st.stift !== focusStift;
  const hidden = !visible[st.key] || st.konton < minKonton || wrongStift;
  return {
    color: COLORS.kartGrans,
    weight: 1.2,
    opacity: hidden ? 0 : 0.7,
    fillColor: COLORS[st.key],
    fillOpacity: hidden ? 0 : 0.55,
  };
}

function popupForEnhet(props) {
  const namn = (props.namn || "").trim();
  const st = statusForFeature(props);
  let badge;
  if (st.key === "ja")  badge = `<span class="popup-status ja">Ansluten till Löneservice</span>`;
  else if (st.key === "nej") badge = `<span class="popup-status nej">Ej ansluten</span>`;
  else                       badge = `<span class="popup-status saknas">Ingen uppgift</span>`;
  let html = `<div class="popup-name">${escapeHtml(namn)}</div>`;
  if (st.stift) html += `<div class="popup-stift">${escapeHtml(st.stift)}</div>`;
  html += badge;
  if (st.konton) {
    html += `<div class="popup-meta">${fmtInt(st.konton)} konton</div>`;
  }
  // Stiftskontext: visa fördelning ja/nej i stiftet med en mini-stapel
  // så man ser hur enheten passar in.
  if (st.stift && dataset?.stift_summary?.[st.stift]) {
    const s = dataset.stift_summary[st.stift];
    const pctK = pct(s.ja_konton, s.totalt_konton);
    html += `<div class="popup-context">
      <div class="popup-context-row">
        <span>${escapeHtml(st.stift)}: ${pctK} av kontona anslutna</span>
      </div>
      ${bar(s.ja_konton, s.totalt_konton)}
      <div class="popup-context-row popup-context-meta">
        ${s.ja_enheter}/${s.totalt_enheter} enheter,
        ${fmtInt(s.ja_konton)}/${fmtInt(s.totalt_konton)} konton
      </div>
    </div>`;
  }
  return html;
}

function buildEnheterLayer(geojson) {
  enheterLayer = L.geoJson(geojson, {
    style: styleEnhet,
    onEachFeature: (feature, layer) => {
      const namn = (feature.properties.namn || "").trim();
      layer.bindTooltip(namn, { sticky: true });
      layer.bindPopup(popupForEnhet(feature.properties));
      if (namn) enhetLayers[namn] = layer;
    },
  }).addTo(map);
}

function zoomToEnhet(namn) {
  const layer = enhetLayers[namn];
  if (layer) {
    const bounds = layer.getBounds();
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 9 });
    layer.openPopup(bounds.getCenter());
    return;
  }
  const anchor = offshoreAnchors[namn];
  const badge = offshoreBadges[namn];
  if (anchor) {
    map.setView(anchor, 9);
    if (badge) badge.openPopup();
  }
}

function buildStiftLayer(geojson) {
  stiftLayer = L.geoJson(geojson, {
    style: {
      color: COLORS.kartGrans, weight: 3, opacity: 0.95,
      fillOpacity: 0, dashArray: "6 4",
    },
    interactive: false,
    onEachFeature: (feature, layer) => {
      const namn = (feature.properties.namn || "").trim();
      if (namn) stiftBounds[namn] = layer.getBounds();
    },
  }).addTo(map);
}

// Choropleth: färglägger stift-polygoner baserat på % anslutna konton.
// Diskret skala 0-100% i fem steg, från vinröd (låg) till mörk grön (hög).
const CHOROPLETH_BINS = [
  { max: 20,  fill: "#7D0037", label: "<20%" },
  { max: 40,  fill: "#B26580", label: "20-39%" },
  { max: 60,  fill: "#D8C0A8", label: "40-59%" },
  { max: 80,  fill: "#7FA694", label: "60-79%" },
  { max: 101, fill: "#00554B", label: ">=80%" },
];

function choroplethBin(percentage) {
  return CHOROPLETH_BINS.find(b => percentage < b.max) || CHOROPLETH_BINS[CHOROPLETH_BINS.length - 1];
}

function buildChoroplethLayer(geojson) {
  choroplethLayer = L.geoJson(geojson, {
    style: feature => {
      const stiftNamn = (feature.properties.namn || "").trim();
      const s = dataset?.stift_summary?.[stiftNamn];
      if (!s || !s.totalt_konton) {
        return { fillOpacity: 0, opacity: 0 };
      }
      const pctKonton = (s.ja_konton / s.totalt_konton) * 100;
      const bin = choroplethBin(pctKonton);
      return {
        color: COLORS.kartGrans,
        weight: 1.5,
        opacity: 0.6,
        fillColor: bin.fill,
        fillOpacity: 0.55,
      };
    },
    onEachFeature: (feature, layer) => {
      const stiftNamn = (feature.properties.namn || "").trim();
      const s = dataset?.stift_summary?.[stiftNamn];
      if (!s) return;
      const pctEnh = pct(s.ja_enheter, s.totalt_enheter);
      const pctK = pct(s.ja_konton, s.totalt_konton);
      layer.bindTooltip(
        `<b>${stiftNamn}</b><br>` +
        `Enheter: ${pctEnh} (${s.ja_enheter}/${s.totalt_enheter})<br>` +
        `Konton: ${pctK} (${fmtInt(s.ja_konton)}/${fmtInt(s.totalt_konton)})`,
        { sticky: true }
      );
    },
  });
}

// Cirkel-overlay där varje territoriell enhet får en cirkel proportionell
// mot antal konton (radius = sqrt(konton) * skala). Kombinerar "var" och
// "hur mycket" på samma vy. Default avstängd för att inte täcka polygonerna.
const accountsMarkers = []; // { marker, ja, konton }
function buildAccountsLayer(geojson) {
  accountsLayer = L.layerGroup();
  for (const f of geojson.features) {
    const namn = (f.properties.namn || "").trim();
    const e = dataset?.enheter?.[namn];
    if (!e || !e.konton) continue;
    let center;
    try {
      center = L.geoJSON(f).getBounds().getCenter();
    } catch {
      continue;
    }
    const radius = Math.sqrt(e.konton) * 1500;  // meters
    const m = L.circle(center, {
      radius,
      color: COLORS.kartGrans,
      weight: 0.8,
      opacity: 0.6,
      fillColor: e.ja ? COLORS.ja : COLORS.nej,
      fillOpacity: 0.55,
      interactive: true,
    });
    m.bindTooltip(`${namn} - ${fmtInt(e.konton)} konton`, { sticky: true });
    accountsLayer.addLayer(m);
    accountsMarkers.push({ marker: m, ja: e.ja, konton: e.konton, stift: e.stift });
  }
}

function applyAccountsVisibility() {
  if (!accountsLayer) return;
  for (const a of accountsMarkers) {
    const key = a.ja ? "ja" : "nej";
    const matchStift = !focusStift || a.stift === focusStift;
    const should = visible[key] && a.konton >= minKonton && matchStift;
    if (should) accountsLayer.addLayer(a.marker);
    else accountsLayer.removeLayer(a.marker);
  }
}

function offshoreEntity({ namn, kortNamn, kategori, ja, konton, anchorStad,
                          dx, dy, popupExtra }) {
  const anchor = STAD[anchorStad];
  const klass = ja ? "ja" : "nej";
  const label = kortNamn || namn;

  // Pil + ankar-cirkel ritas i en SVG ankrad på staden. SVG har
  // overflow:visible så linjen kan sträckas ut åt vilket håll som
  // helst, oberoende av zoom-nivå. Linjen uppdateras i runtime av
  // layoutOffshore() när badgen flyttas av kollisionsupplösaren.
  // SVG-canvas täcker 600x600 pixel centrerad på (0,0) så pilen kan
  // ritas åt valfritt håll utan att klippas. Wrappen är 0x0 men SVG
  // har overflow:visible och positioneras med negativ left/top så
  // SVG-koordinat (0,0) hamnar precis på iconen-ankarpunkten = staden.
  const ARROW_HALF = 300;
  const arrowMarker = L.marker(anchor, {
    icon: L.divIcon({
      className: "offshore-arrow-wrap",
      html: `<svg class="offshore-arrow-svg"
                  width="${ARROW_HALF * 2}" height="${ARROW_HALF * 2}"
                  viewBox="-${ARROW_HALF} -${ARROW_HALF} ${ARROW_HALF * 2} ${ARROW_HALF * 2}"
                  style="left:-${ARROW_HALF}px;top:-${ARROW_HALF}px">
               <line x1="0" y1="0" x2="${dx}" y2="${dy}"
                     stroke="${COLORS.kartGrans}" stroke-width="1.4"
                     stroke-dasharray="3 3" stroke-opacity="0.9"/>
               <circle cx="0" cy="0" r="4"
                       fill="${COLORS.kartGrans}" stroke="#fff"
                       stroke-width="1.5"/>
             </svg>`,
      iconSize: [0, 0], iconAnchor: [0, 0],
    }),
    interactive: false, keyboard: false,
  });

  const popupHtml = `
    <div class="popup-name">${escapeHtml(namn)}</div>
    <div class="popup-stift">${escapeHtml(kategori)} - ${escapeHtml(anchorStad)}</div>
    <span class="popup-status ${klass}">
      ${ja ? "Ansluten till Löneservice" : "Ej ansluten"}
    </span>
    <div class="popup-meta">${fmtInt(konton)} konton</div>
    ${popupExtra ? `<div class="popup-meta" style="font-style:italic">${popupExtra}</div>` : ""}`;
  const badgeMarker = L.marker(anchor, {
    icon: L.divIcon({
      className: "offshore-badge-wrap",
      html: `<div class="offshore-badge ${klass}"
                  style="transform:translate(${dx}px, ${dy}px)
                         translate(-50%, -50%);">
               ${escapeHtml(label)}
               <small>${fmtInt(konton)} konton</small>
             </div>`,
      iconSize: [0, 0], iconAnchor: [0, 0],
    }),
    riseOnHover: true,
  }).bindPopup(popupHtml);

  return {
    arrowMarker, badgeMarker, cityLatLng: anchor,
    dxPref: dx, dyPref: dy,
    width: 130, height: 36,   // uppdateras vid measureBadges()
  };
}

function pushEntry(entry, status, stift, namn) {
  offshoreEntries.push({ ...entry, status });
  offshoreItems.push({ marker: entry.arrowMarker, status, stift });
  offshoreItems.push({ marker: entry.badgeMarker, status, stift });
  if (namn) offshoreBadges[namn] = entry.badgeMarker;
}

function buildOffshoreLayer() {
  const items = [];

  for (const [namn, info] of Object.entries(dataset.stiftsenheter || {})) {
    const cfg = OFFSHORE_STIFT[namn];
    if (!cfg) { console.warn("ingen offshore-position för", namn); continue; }
    const [anchorStad, [dx, dy]] = cfg;
    if (STAD[anchorStad]) offshoreAnchors[namn] = STAD[anchorStad];
    const e = offshoreEntity({
      namn, kortNamn: namn.replace(/ stift$/, " stiftskansli"),
      kategori: "Stiftskansli",
      ja: info.ja, konton: info.konton, anchorStad, dx, dy,
    });
    pushEntry(e, info.ja ? "ja" : "nej", namn, namn);
    items.push(e.arrowMarker, e.badgeMarker);
  }

  // Församlingar utan eget område får "Icke-territoriell församling"
  // som popup-extra; samfälligheter etc får ingen extra-text.
  const ICKE_TERR = new Set([
    "Hovförsamlingen",
    "Finska församlingen",
    "Tyska S:ta Gertruds församling",
    "Karlskrona Amiralitetsförsamling",
  ]);
  for (const o of dataset.ovrigt || []) {
    const cfg = OFFSHORE_OVRIGT[o.namn];
    if (!cfg) { console.warn("ingen offshore-position för", o.namn); continue; }
    const [anchorStad, [dx, dy]] = cfg;
    if (STAD[anchorStad]) offshoreAnchors[o.namn] = STAD[anchorStad];
    const e = offshoreEntity({
      namn: o.namn, kortNamn: o.namn,
      kategori: o.stift,
      ja: o.ja, konton: o.konton, anchorStad, dx, dy,
      popupExtra: ICKE_TERR.has(o.namn) ? "Icke-territoriell församling" : null,
    });
    pushEntry(e, o.ja ? "ja" : "nej", o.stift, o.namn);
    items.push(e.arrowMarker, e.badgeMarker);
  }

  if (dataset.trossamfund) {
    const t = dataset.trossamfund;
    const [anchorStad, [dx, dy]] = OFFSHORE_TROSS;
    if (STAD[anchorStad]) offshoreAnchors[t.namn] = STAD[anchorStad];
    const e = offshoreEntity({
      namn: t.namn, kortNamn: "Kyrkokansliet",
      kategori: "Nationell nivå - Kyrkokansliet",
      ja: t.ja, konton: t.konton, anchorStad, dx, dy,
    });
    pushEntry(e, t.ja ? "ja" : "nej", null, t.namn);
    items.push(e.arrowMarker, e.badgeMarker);
  }

  offshoreLayer = L.layerGroup(items).addTo(map);

  // Mät badge-storlekar efter första render-pass så kollisions-
  // upplösaren har korrekta dimensioner.
  requestAnimationFrame(() => { measureBadges(); scheduleLayout(); });
  map.on("zoomend moveend", scheduleLayout);
}

function measureBadges() {
  for (const e of offshoreEntries) {
    const wrap = e.badgeMarker.getElement();
    if (!wrap) continue;
    const badge = wrap.querySelector(".offshore-badge");
    if (!badge) continue;
    e.width = badge.offsetWidth || e.width;
    e.height = badge.offsetHeight || e.height;
  }
}

function scheduleLayout() {
  if (layoutScheduled) return;
  layoutScheduled = true;
  requestAnimationFrame(() => { layoutScheduled = false; layoutOffshore(); });
}

// Anti-overlap-layout. Kör vid varje zoom/move + filter-toggle.
// Algoritm: börja varje synlig badge på sin föredragna pixel-offset
// från staden. Iterera N gånger och knuffa krockande badges längs
// minsta-överlapp-axeln tills allt är fritt eller iter-budget slut.
function layoutOffshore() {
  if (!offshoreLayer || !offshoreEntries.length) return;
  const active = offshoreEntries.filter(e => visible[e.status]);
  if (!active.length) return;

  const PADDING = 4;
  for (const e of active) {
    const cp = map.latLngToContainerPoint(e.cityLatLng);
    e._cx = cp.x;
    e._cy = cp.y;
    e._x = cp.x + e.dxPref;
    e._y = cp.y + e.dyPref;
  }

  for (let iter = 0; iter < 60; iter++) {
    let moved = false;
    for (let i = 0; i < active.length; i++) {
      for (let j = i + 1; j < active.length; j++) {
        const a = active[i], b = active[j];
        const halfAW = a.width/2 + PADDING, halfAH = a.height/2 + PADDING;
        const halfBW = b.width/2 + PADDING, halfBH = b.height/2 + PADDING;
        const ovX = (halfAW + halfBW) - Math.abs(a._x - b._x);
        const ovY = (halfAH + halfBH) - Math.abs(a._y - b._y);
        if (ovX <= 0 || ovY <= 0) continue;
        // Knuffa längs minsta-överlapps-axeln.
        if (ovX < ovY) {
          const sign = a._x < b._x ? -1 : 1;
          const push = ovX / 2 + 0.5;
          a._x += sign * push;
          b._x -= sign * push;
        } else {
          const sign = a._y < b._y ? -1 : 1;
          const push = ovY / 2 + 0.5;
          a._y += sign * push;
          b._y -= sign * push;
        }
        moved = true;
      }
    }
    if (!moved) break;
  }

  for (const e of active) {
    const dx = e._x - e._cx, dy = e._y - e._cy;
    const wrap = e.badgeMarker.getElement();
    if (wrap) {
      const badge = wrap.querySelector(".offshore-badge");
      if (badge) {
        badge.style.transform =
          `translate(${dx}px, ${dy}px) translate(-50%, -50%)`;
      }
    }
    const arrowWrap = e.arrowMarker.getElement();
    if (arrowWrap) {
      const line = arrowWrap.querySelector("line");
      if (line) {
        line.setAttribute("x2", dx);
        line.setAttribute("y2", dy);
      }
    }
  }
}

function applyOffshoreVisibility() {
  if (!offshoreLayer) return;
  for (const { marker, status, stift } of offshoreItems) {
    const matchStift = !focusStift || stift === focusStift;
    const should = visible[status] && matchStift;
    const has = offshoreLayer.hasLayer(marker);
    if (should && !has) offshoreLayer.addLayer(marker);
    else if (!should && has) offshoreLayer.removeLayer(marker);
  }
  scheduleLayout();
}

          document.getElementById("choro-scale").classList.toggle("show", e.target.checked);
        }
        writeHash();
      });
    });
    return div;
  },
});
new FilterControl().addTo(map);

const SummaryControl = L.Control.extend({
  options: { position: "topleft" },
  onAdd() {
    const div = L.DomUtil.create("div", "panel summary");
    div.id = "summary-panel";
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);
    return div;
  },
});
const summaryControl = new SummaryControl();
summaryControl.addTo(map);

function pct(num, den) {
  if (!den) return "-";
  return `${Math.round((num / den) * 100)}%`;
}

function bar(num, den) {
  const p = den ? (num / den) * 100 : 0;
  return `<div class="konto-bar"><span style="width:${p.toFixed(1)}%"></span></div>`;
}

function renderSummary() {
  const el = document.getElementById("summary-panel");
  if (!dataset) return;
  // Sortera stiften enligt skpkod (Unit-API). Trossamfundet bryts ut
  // och visas separat under en avgränsare; det räknas ändå med i totalen.
  const stift = Object.entries(dataset.stift_summary)
    .filter(([n]) => n !== TROSS_NAMN)
    .sort(([a], [b]) => (STIFT_KOD[a] || "99").localeCompare(STIFT_KOD[b] || "99"));
  const tross = dataset.stift_summary[TROSS_NAMN];

  let totEnh = 0, totEnhJa = 0, totK = 0, totKJa = 0;
  let rows = "";
  for (const [namn, s] of stift) {
    totEnh += s.totalt_enheter;
    totEnhJa += s.ja_enheter;
    totK += s.totalt_konton;
    totKJa += s.ja_konton;
    rows += `<tr>
      <td>${escapeHtml(STIFT_STAD[namn] || namn)}</td>
      <td>${s.ja_enheter}/${s.totalt_enheter}</td>
      <td class="pct">${pct(s.ja_enheter, s.totalt_enheter)}</td>
      <td>${fmtInt(s.ja_konton)}/${fmtInt(s.totalt_konton)}</td>
      <td class="pct">${pct(s.ja_konton, s.totalt_konton)}</td>
      <td class="bar-cell">${bar(s.ja_konton, s.totalt_konton)}</td>
    </tr>`;
  }
  let trossRow = "";
  if (tross) {
    totEnh += tross.totalt_enheter;
    totEnhJa += tross.ja_enheter;
    totK += tross.totalt_konton;
    totKJa += tross.ja_konton;
    trossRow = `<tr class="separator"><td colspan="6"></td></tr>
      <tr class="tross-row">
        <td>Kyrkokansliet</td>
        <td>${tross.ja_enheter}/${tross.totalt_enheter}</td>
        <td class="pct">${pct(tross.ja_enheter, tross.totalt_enheter)}</td>
        <td>${fmtInt(tross.ja_konton)}/${fmtInt(tross.totalt_konton)}</td>
        <td class="pct">${pct(tross.ja_konton, tross.totalt_konton)}</td>
        <td class="bar-cell">${bar(tross.ja_konton, tross.totalt_konton)}</td>
      </tr>`;
  }
  el.innerHTML = `
    <div class="tabs" role="tablist">
      <button data-tab="overview" class="active">Översikt</button>
      <button data-tab="stift">Per stift</button>
      <button data-tab="top">Största ej-anslutna</button>
      <button data-tab="histo">Storleksfördelning</button>
    </div>
    <div class="tab-panel active" data-panel="overview">
      ${renderOverview(totEnhJa, totEnh, totKJa, totK)}
    </div>
    <div class="tab-panel" data-panel="stift">
      <table>
        <thead><tr>
          <th>Stift</th><th>Enheter</th><th></th><th>Konton</th><th></th><th></th>
        </tr></thead>
        <tbody>${rows}${trossRow}
          <tr class="total">
            <td>Totalt</td>
            <td>${totEnhJa}/${totEnh}</td>
            <td class="pct">${pct(totEnhJa, totEnh)}</td>
            <td>${fmtInt(totKJa)}/${fmtInt(totK)}</td>
            <td class="pct">${pct(totKJa, totK)}</td>
            <td class="bar-cell">${bar(totKJa, totK)}</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="tab-panel" data-panel="top">
      ${renderTopEjAnslutna()}
    </div>
    <div class="tab-panel" data-panel="histo">
      ${renderHistogram()}
    </div>`;
  el.querySelectorAll(".tabs button").forEach(btn => {
    btn.addEventListener("click", () => {
      activeTab = btn.dataset.tab;
      el.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b === btn));
      el.querySelectorAll(".tab-panel").forEach(p =>
        p.classList.toggle("active", p.dataset.panel === activeTab));
      writeHash();
    });
  });
  el.querySelectorAll(".top-list li.klickbar").forEach(li => {
    li.addEventListener("click", () => zoomToEnhet(li.dataset.namn));
  });
}

function donutSvg(numerator, denominator, size = 90) {
  const cx = size / 2, cy = size / 2, r = size * 0.4, sw = size * 0.16;
  const c = 2 * Math.PI * r;
  const ratio = denominator ? numerator / denominator : 0;
  const dash = c * ratio;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
            stroke="${COLORS.nej}" stroke-width="${sw}" opacity="0.18"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
            stroke="${COLORS.ja}" stroke-width="${sw}"
            stroke-dasharray="${dash} ${c}"
            transform="rotate(-90 ${cx} ${cy})"
            stroke-linecap="butt"/>
  </svg>`;
}

function renderOverview(enhJa, enhTot, kJa, kTot) {
  return `<div class="donut-row">
    <div class="donut-card">
      ${donutSvg(enhJa, enhTot)}
      <div class="donut-pct">${pct(enhJa, enhTot)}</div>
      <div class="donut-label">Enheter</div>
      <div class="donut-meta">${enhJa} av ${enhTot}</div>
    </div>
    <div class="donut-card">
      ${donutSvg(kJa, kTot)}
      <div class="donut-pct">${pct(kJa, kTot)}</div>
      <div class="donut-label">Konton</div>
      <div class="donut-meta">${fmtInt(kJa)} av ${fmtInt(kTot)}</div>
    </div>
  </div>`;
}

function renderHistogram() {
  // Bins av enhets-storlek (antal konton), staplat Ja/Nej.
  const enheter = dataset?.enheter || {};
  const ovrigt = dataset?.ovrigt || [];
  const stiftsenheter = dataset?.stiftsenheter || {};
  const all = [];
  for (const e of Object.values(enheter)) all.push(e);
  for (const o of ovrigt) all.push({ ja: o.ja, konton: o.konton });
  for (const s of Object.values(stiftsenheter)) all.push({ ja: s.ja, konton: s.konton });

  // Bin-gränser i konton. Logaritmiska steg eftersom storleksspridningen
  // är stor (5 - 250+).
  const bins = [
    { lo: 0,   hi: 25,  label: "<25" },
    { lo: 25,  hi: 50,  label: "25-49" },
    { lo: 50,  hi: 100, label: "50-99" },
    { lo: 100, hi: 200, label: "100-199" },
    { lo: 200, hi: Infinity, label: "200+" },
  ];
  for (const b of bins) { b.ja = 0; b.nej = 0; }
  for (const e of all) {
    if (!e.konton) continue;
    const b = bins.find(b => e.konton >= b.lo && e.konton < b.hi);
    if (!b) continue;
    if (e.ja) b.ja++; else b.nej++;
  }
  const maxCount = Math.max(...bins.map(b => b.ja + b.nej));

  // SVG: 280x130 viewBox med padding för axlar.
  const W = 280, H = 130, padL = 22, padB = 24, padT = 6, padR = 4;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const bw = innerW / bins.length;

  const ticks = [];
  for (let i = 0; i <= 4; i++) {
    const v = Math.round((maxCount * i) / 4);
    const y = padT + innerH - (innerH * i) / 4;
    ticks.push(`<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"
      stroke="rgba(125,0,55,0.1)" stroke-width="0.5"/>
      <text class="histo-axis-label" x="${padL - 4}" y="${y + 3}"
        text-anchor="end">${v}</text>`);
  }

  const bars = bins.map((b, i) => {
    const x = padL + i * bw + 3;
    const w = bw - 6;
    const total = b.ja + b.nej;
    const totH = maxCount ? (total / maxCount) * innerH : 0;
    const jaH = total ? (b.ja / total) * totH : 0;
    const nejH = totH - jaH;
    const yJa = padT + innerH - totH;
    const yNej = yJa + jaH;
    const labelY = H - 8;
    return `
      <rect class="histo-bar-ja" x="${x}" y="${yJa}" width="${w}" height="${jaH}"/>
      <rect class="histo-bar-nej" x="${x}" y="${yNej}" width="${w}" height="${nejH}"/>
      <text class="histo-axis-label" x="${x + w / 2}" y="${labelY}"
        text-anchor="middle">${b.label}</text>
      <title>${b.label} konton: ${b.ja} ja, ${b.nej} nej</title>`;
  }).join("");

  return `<div class="histo-wrap">
    <div class="histo-meta">Antal enheter per storlek (konton), staplat Ja/Nej</div>
    <svg class="histo-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      ${ticks.join("")}
      ${bars}
    </svg>
  </div>`;
}

function renderTopEjAnslutna() {
  // 10 största enheter (efter antal konton) som inte är anslutna.
  const enheter = dataset?.enheter || {};
  const ovrigt = dataset?.ovrigt || [];
  const stiftsenheter = dataset?.stiftsenheter || {};
  const all = [];
  for (const [namn, e] of Object.entries(enheter)) {
    all.push({ namn, stift: e.stift, ja: e.ja, konton: e.konton });
  }
  for (const o of ovrigt) {
    all.push({ namn: o.namn, stift: o.stift, ja: o.ja, konton: o.konton });
  }
  for (const [namn, s] of Object.entries(stiftsenheter)) {
    all.push({ namn, stift: namn, ja: s.ja, konton: s.konton });
  }
  const top = all
    .filter(e => !e.ja && e.konton > 0)
    .sort((a, b) => b.konton - a.konton)
    .slice(0, 10);
  if (!top.length) return '<div class="empty">Inga ej-anslutna enheter.</div>';
  const items = top.map(e => {
    const klickbar = (enhetLayers[e.namn] || offshoreAnchors[e.namn]) ? "klickbar" : "";
    return `
    <li class="${klickbar}" data-namn="${escapeHtml(e.namn)}">
      <div>
        <span class="top-namn">${escapeHtml(e.namn)}</span>
        <span class="top-stift">${escapeHtml(e.stift || "")}</span>
      </div>
      <span class="top-konton">${fmtInt(e.konton)}</span>
    </li>`;
  }).join("");
  return `<div class="top-list"><ol>${items}</ol></div>`;
}

function renderHeader() {
  const summary = dataset.stift_summary;
  let totEnh = 0, totEnhJa = 0, totK = 0, totKJa = 0;
  for (const s of Object.values(summary)) {
    totEnh += s.totalt_enheter; totEnhJa += s.ja_enheter;
    totK += s.totalt_konton;     totKJa += s.ja_konton;
  }
  document.getElementById("subtitle").textContent =
    `${totEnhJa} av ${totEnh} enheter anslutna - ${fmtInt(totKJa)} av ${fmtInt(totK)} konton (2026-05-05)`;
}

async function init() {
  const [enheter, stift, ls] = await Promise.all([
    fetch("data/ekonomiska_enheter.geojson").then(r => r.json()),
    fetch("data/stift.geojson").then(r => r.json()),
    fetch("data/loneservice.json").then(r => r.json()),
  ]);
  dataset = ls;
  buildEnheterLayer(enheter);
  buildStiftLayer(stift);
  buildAccountsLayer(enheter);
  buildChoroplethLayer(stift);
  buildOffshoreLayer();
  populateStiftDropdown();
  renderHeader();
  renderSummary();
  applyHashState();
  setupMobileSheet();
  window.addEventListener("hashchange", applyHashState);
}

// Mobil-sheet: flyttar Leaflet-panelens DOM-nod in i sheet:en när
// användaren öppnar den, och tillbaka till ursprunglig parent vid stäng.
// Event-handlers (ja/nej, dropdown, tabs) följer med noden så de
// fortsätter fungera.
const MOBILE_PANEL_TITLES = {
  summary: "Statistik", filter: "Filter", legend: "Förklaring",
};
const mobilePanelHomes = {};
let mobileOpenName = null;

function setupMobileSheet() {
  for (const name of Object.keys(MOBILE_PANEL_TITLES)) {
    const el = document.querySelector(`.panel.${name}`);
    if (el) mobilePanelHomes[name] = el.parentNode;
  }
  for (const btn of document.querySelectorAll(".mobile-bar button")) {
    btn.addEventListener("click", () => {
      const name = btn.dataset.mobilePanel;
      if (mobileOpenName === name) closeMobileSheet();
      else openMobileSheet(name);
    });
  }
  document.getElementById("mobile-sheet-close")
    .addEventListener("click", closeMobileSheet);
  // Vid övergång till desktop-bredd: stäng sheeten så panelens DOM-nod
  // flyttas tillbaka till sin Leaflet-position innan media-queryn döljer
  // mobile-sheet helt.
  window.addEventListener("resize", () => {
    if (window.innerWidth > 700 && mobileOpenName) closeMobileSheet();
    alignMobileBar();
  });
  alignMobileBar();
}

function alignMobileBar() {
  if (window.innerWidth > 700) return;
  const zoomOut = document.querySelector(".leaflet-control-zoom-out");
  const bar = document.querySelector(".mobile-bar");
  if (!zoomOut || !bar) return;
  const rect = zoomOut.getBoundingClientRect();
  const distFromBottom = window.innerHeight - rect.bottom;
  bar.style.bottom = distFromBottom + "px";
}

function openMobileSheet(name) {
  if (mobileOpenName) returnPanelHome(mobileOpenName);
  const el = document.querySelector(`.panel.${name}`);
  if (!el) return;
  document.getElementById("mobile-sheet-content").appendChild(el);
  document.getElementById("mobile-sheet-title").textContent =
    MOBILE_PANEL_TITLES[name] || "";
  document.getElementById("mobile-sheet").classList.add("open");
  document.querySelectorAll(".mobile-bar button").forEach(b =>
    b.classList.toggle("active", b.dataset.mobilePanel === name));
  mobileOpenName = name;
}

function returnPanelHome(name) {
  const el = document.querySelector(`.panel.${name}`);
  const home = mobilePanelHomes[name];
  if (el && home) home.appendChild(el);
}

function closeMobileSheet() {
  if (!mobileOpenName) return;
  returnPanelHome(mobileOpenName);
  document.getElementById("mobile-sheet").classList.remove("open");
  document.querySelectorAll(".mobile-bar button").forEach(b =>
    b.classList.remove("active"));
  mobileOpenName = null;
}

function populateStiftDropdown() {
  const sel = document.getElementById("focus-stift");
  if (!sel) return;
  const stiftNamn = Object.keys(dataset.stift_summary || {})
    .filter(n => n !== TROSS_NAMN)
    .sort((a, b) => (STIFT_KOD[a] || "99").localeCompare(STIFT_KOD[b] || "99"));
  for (const namn of stiftNamn) {
    const opt = document.createElement("option");
    opt.value = namn;
    opt.textContent = namn;
    sel.appendChild(opt);
  }
}

init().catch(err => {
  document.getElementById("subtitle").textContent =
    `Kunde inte ladda data: ${err.message}`;
  console.error(err);
});
</script>
